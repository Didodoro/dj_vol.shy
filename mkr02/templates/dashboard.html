<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <title>Weather Dashboard</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold text-primary">Weather Analytics</h1>
            <button id="generate-btn" class="btn btn-success">Update Data</button>
        </div>

        <div class="row mb-5">
            <div class="col-md-6 border-end">
                <div class="card shadow-sm p-2">
                    {{ temp_plot|safe }}
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm p-2">
                    {{ press_plot|safe }}
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-3">Measurements</h4>
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Date</th>
                            <th>Temperature, °C</th>
                            <th>Pressure, mmHg</th>
                        </tr>
                    </thead>
                    <tbody id="weather-table-body">
                        {% for entry in data %}
                        <tr>
                            <td>{{ entry.date }}</td>
                            <td>{{ entry.temperature }}</td>
                            <td>{{ entry.pressure }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Скрипт оновлення графіків та таблиці у разі натискання кнопки "Update Data"
        document.getElementById('generate-btn').addEventListener('click', function () {
            fetch("", {
                method: 'POST',
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'success') {
                    // Виклик функції оновлення віджетів
                    updateWidgets(result.data);
                }
            })
            .catch(error => console.error('Error:', error));
        });

        // Функція для динамічного оновлення таблиці та графіків
        function updateWidgets(newData) {
            // 1. Оновлення графіка температури
            var updateTemp = {
                x: [newData.map(d => d.date)],
                y: [newData.map(d => d.temperature)]
            };
            Plotly.restyle('temp_plot', updateTemp);

            // 2. Оновлення графіка тиску
            var updatePress = {
                x: [newData.map(d => d.date)],
                y: [newData.map(d => d.pressure)]
            };
            Plotly.restyle('press_plot', updatePress);

            // 3. Оновлення таблиці
            const tableBody = document.getElementById('weather-table-body');
            
            // Очищення таблиці
            tableBody.innerHTML = "";
            
            // Цикл створення та заповнення нових рядків
            newData.forEach(item => {
                const row = `
                    <tr>
                        <td>${item.date}</td>
                        <td>${item.temperature}</td>
                        <td>${item.pressure}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        }
    </script>
</body>
</html>
